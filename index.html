<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QS · AI 项目</title>
  <style>
    :root {
      --bg: #0a0b10;
      --text: #e8eaf2;
      --muted: #8a8fa3;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #7c5cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 120px 24px 80px;
    }
    header { margin-bottom: 56px; }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin-top: 10px; font-size: 16px; }

    .list { display: flex; flex-direction: column; }
    a.item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 22px 0;
      border-top: 1px solid var(--line);
      transition: padding-left 0.18s ease;
    }
    a.item:last-child { border-bottom: 1px solid var(--line); }
    a.item:hover { padding-left: 8px; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .name { font-size: 19px; font-weight: 600; }
    a.item:hover .name { color: var(--accent); }
    .lang { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .desc { color: var(--muted); font-size: 14.5px; margin-top: 6px; }

    footer {
      margin-top: 64px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>QS 的 AI 项目</h1>
      <p>用 AI 做的一些公开项目。</p>
    </header>

    <div class="list">
      <a class="item" href="https://github.com/bitqs/sharp">
        <div class="row">
          <span class="name">sharp</span>
          <span class="lang">Skill</span>
        </div>
        <div class="desc">Claude Code 的 Sharp 模式技能 —— 乔布斯 × 马斯克式的判断力框架。</div>
      </a>

      <a class="item" href="https://github.com/bitqs/maia">
        <div class="row">
          <span class="name">maia</span>
          <span class="lang">Python</span>
        </div>
        <div class="desc">一个用 Python 写的项目。(可在此补上一句话简介)</div>
      </a>

      <a class="item" href="https://github.com/bitqs/thegametheory">
        <div class="row">
          <span class="name">thegametheory</span>
          <span class="lang">JavaScript</span>
        </div>
        <div class="desc">一个用 JavaScript 写的项目。(可在此补上一句话简介)</div>
      </a>
    </div>

    <footer>
      更多见 <a href="https://github.com/bitqs">github.com/bitqs</a>
    </footer>
  </main>
</body>
</html>
