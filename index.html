<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QS · AI 项目</title>
  <style>
    :root {
      --bg: #0a0b10;
      --text: #e8eaf2;
      --muted: #8a8fa3;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #7c5cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 120px 24px 80px;
    }
    header { margin-bottom: 56px; }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin-top: 10px; font-size: 16px; }

    .list { display: flex; flex-direction: column; }
    .item {
      padding: 24px 0;
      border-top: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 1px solid var(--line); }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .name { font-size: 19px; font-weight: 600; }
    .lang { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .desc { color: var(--muted); font-size: 14.5px; margin-top: 8px; }

    .links { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .links a {
      font-size: 13px;
      text-decoration: none;
      color: var(--text);
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .links a.primary { border-color: rgba(124, 92, 255, 0.5); color: var(--accent); }
    .links a.primary:hover { background: rgba(124, 92, 255, 0.12); }

    footer {
      margin-top: 64px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>QS 的 AI 项目</h1>
      <p>用 AI 做的一些公开项目。</p>
    </header>

    <div class="list">
      <article class="item">
        <div class="row">
          <span class="name">maia</span>
          <span class="lang">Python</span>
        </div>
        <div class="desc">把任意知识体系转成可交互的双语教学图谱，按逻辑顺序边看边学（已有道德经、金刚经等线上示例）。</div>
        <div class="links">
          <a class="primary" href="https://bitqs.github.io/maia/daodejing.html" target="_blank" rel="noopener">产品页 ↗</a>
          <a href="https://github.com/bitqs/maia" target="_blank" rel="noopener">Git ↗</a>
        </div>
      </article>

      <article class="item">
        <div class="row">
          <span class="name">thegametheory</span>
          <span class="lang">JavaScript</span>
        </div>
        <div class="desc">一系列「探究游戏为何好玩」的极简小游戏，把玩法拆到最小的上瘾内核，再展示它的运作机制。</div>
        <div class="links">
          <a class="primary" href="https://thegametheory.pages.dev" target="_blank" rel="noopener">产品页 ↗</a>
          <a href="https://github.com/bitqs/thegametheory" target="_blank" rel="noopener">Git ↗</a>
        </div>
      </article>

      <article class="item">
        <div class="row">
          <span class="name">sharp</span>
          <span class="lang">Claude Skill</span>
        </div>
        <div class="desc">Claude Code 的 Sharp 模式技能 —— 把乔布斯式产品直觉与马斯克式第一性原理，合成一套判断力框架。</div>
        <div class="links">
          <a href="https://github.com/bitqs/sharp" target="_blank" rel="noopener">Git ↗</a>
        </div>
      </article>
    </div>

    <footer>
      更多见 <a href="https://github.com/bitqs" target="_blank" rel="noopener">github.com/bitqs</a>
    </footer>
  </main>
</body>
</html>
